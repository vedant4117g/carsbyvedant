<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARS BY VEDANT | Ultra Luxury Fleet</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff003c;
            --primary-glow: rgba(255, 0, 60, 0.4);
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.7);
            --border-glow: rgba(255, 255, 255, 0.1);
            --accent-gold: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top, #151d30 0%, var(--bg-dark) 70%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* Hero Banner Header */
        header {
            padding: 50px 20px 30px;
            text-align: center;
            position: relative;
            background: linear-gradient(180deg, rgba(255, 0, 60, 0.15) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255, 0, 60, 0.3);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #ff003c, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px var(--primary-glow);
        }

        .brand-subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1300px;
            margin: 50px auto 0;
            padding: 0 25px;
        }

        /* Modern Grid */
        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 35px;
        }

        /* Glassmorphism Luxury Card */
        .car-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .car-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        .image-box {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .car-card:hover .image-box img {
            transform: scale(1.12);
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 5px 14px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            text-transform: uppercase;
        }

        .card-details {
            padding: 24px;
        }

        .car-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
        }

        /* Performance Specs Pill */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .spec-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .spec-item i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .bottom-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .price-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .btn-drive {
            background: linear-gradient(135deg, #ff003c 0%, #b91c1c 100%);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: all 0.3s ease;
        }

        .btn-drive:hover {
            background: linear-gradient(135deg, #ff2a5f 0%, #dc2626 100%);
            box-shadow: 0 6px 25px rgba(255, 0, 60, 0.7);
            transform: scale(1.05);
        }

        /* Luxury Booking Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #111827;
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 35px 30px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 40px var(--primary-glow);
            animation: popUp 0.3s ease;
        }

        @keyframes popUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h2 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .modal-box p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #030712;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: border 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-confirm {
            flex: 2;
            background: var(--primary);
            color: white;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background: #374151;
            color: white;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1 class="brand-title">CARS BY VEDANT</h1>
    <p class="brand-subtitle"><i class="fa-solid fa-gauge-high"></i> High Performance & Supercars Fleet</p>
</header>

<div class="container">
    <div class="cars-grid" id="carsGrid">
        <div style="grid-column: 1/-1; text-align: center; padding: 50px; font-size: 1.3rem; color: #94a3b8;">
            <i class="fa-solid fa-spinner fa-spin"></i> Fetching luxury beasts from AWS RDS...
        </div>
    </div>
</div>

<div class="modal" id="bookingModal">
    <div class="modal-box">
        <h2>RESERVE DRIVE</h2>
        <p>Selected Machine: <b id="carNameShow" style="color:var(--primary);"></b></p>
        
        <input type="hidden" id="selectedCarName">
        
        <div class="input-group">
            <input type="text" id="userName" placeholder="Your Full Name" required>
        </div>
        <div class="input-group">
            <input type="text" id="userPhone" placeholder="Mobile Number (+91)" required>
        </div>

        <div class="modal-actions">
            <button class="btn-confirm" onclick="confirmBooking()">CONFIRM BOOKING</button>
            <button class="btn-cancel" onclick="closeModal()">CANCEL</button>
        </div>
    </div>
</div>

<script>
    fetch('/api/cars')
        .then(res => res.json())
        .then(data => {
            const grid = document.getElementById('carsGrid');
            grid.innerHTML = '';
            data.forEach(car => {
                grid.innerHTML += `
                    <div class="car-card">
                        <div class="image-box">
                            <span class="badge"><i class="fa-solid fa-fire"></i> ${car.brand}</span>
                            <img src="${car.imageUrl}" alt="${car.name}">
                        </div>
                        <div class="card-details">
                            <h3 class="car-name">${car.name}</h3>
                            <div class="specs-grid">
                                <div class="spec-item">
                                    <i class="fa-solid fa-bolt"></i>
                                    <span>${car.hp}</span>
                                </div>
                                <div class="spec-item">
                                    <i class="fa-solid fa-stopwatch"></i>
                                    <span>${car.acceleration}</span>
                                </div>
                            </div>
                            <div class="bottom-action">
                                <div class="price-tag">${car.price}</div>
                                <button class="btn-drive" onclick="openModal('${car.name}')">TEST DRIVE</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        })
        .catch(err => {
            document.getElementById('carsGrid').innerHTML = '<p style="color:#ef4444;text-align:center;">Failed to connect with Backend API.</p>';
        });

    function openModal(carName) {
        document.getElementById('selectedCarName').value = carName;
        document.getElementById('carNameShow').innerText = carName;
        document.getElementById('bookingModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('bookingModal').style.display = 'none';
    }

    function confirmBooking() {
        const name = document.getElementById('userName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        const car = document.getElementById('selectedCarName').value;

        if(!name || !phone) {
            alert('कृपया अपना नाम और मोबाइल नंबर भरें!');
            return;
        }

        fetch('/api/book', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customerName: name, phone: phone, carName: car })
        })
        .then(res => res.text())
        .then(msg => {
            alert('🏎‍🟀 ' + msg);
            closeModal();
            document.getElementById('userName').value = '';
            document.getElementById('userPhone').value = '';
        })
        .catch(err => alert('Booking Failed! Please check backend.'));
    }
</script>
</body>
</html>
